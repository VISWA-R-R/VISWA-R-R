# .github/workflows/github-stats.yml

name: Update GitHub Stats

on:

  # Automatically update whenever you commit/push
  push:
    branches:
      - main
      - master

  # Automatically update every day
  schedule:
    - cron: "15 0 * * *"

  # Allows manual update
  workflow_dispatch:

# Required to read contribution information
# and update SVG files in this repository.
permissions:
  contents: write

jobs:

  update-github-stats:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------
      # Checkout
      # --------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------
      # Python
      # --------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # --------------------------------------------
      # Generate Graph + Streak
      # --------------------------------------------

      - name: Generate GitHub Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate_stats.py

      # --------------------------------------------
      # Commit Changes
      # --------------------------------------------

      - name: Commit Updated Stats
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-wave.svg
          git add assets/github-streak.svg

          if git diff --cached --quiet; then

            echo "No changes detected."

          else

            git commit \
              -m "Update GitHub contribution stats"

            git push

          fi
