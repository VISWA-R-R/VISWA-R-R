name: Update Contribution Wave Graph

on:
  push:
    branches:
      - main
      - master

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-graph:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Wave Graph
        run: python generate_graph.py

      - name: Commit Graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-contribution-graph.svg

          if git diff --cached --quiet; then
            echo "No changes to graph."
          else
            git commit -m "Update contribution wave graph"
            git push
          fi
