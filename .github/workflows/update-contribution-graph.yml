# .github/workflows/update-contribution-graph.yml

name: Update GitHub Contribution Graph

on:
  push:
    branches:
      - main
      - master

  schedule:
    # Runs every day at 00:00 UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate contribution graph
        run: python generate_graph.py

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-contribution-graph.svg

          if git diff --cached --quiet; then
            echo "No graph changes."
          else
            git commit -m "Update contribution graph [skip ci]"
            git push
          fi
