name: Update GitHub Statistics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get GitHub statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/graphql \
            -d '{"query":"query { user(login: \"VISWA-R-R\") { contributionsCollection { contributionCalendar { totalContributions weeks { contributionDays { date contributionCount } } } } } }"}' \
            > github-data.json

      - name: Generate GitHub Statistics SVG
        run: |
          python3 <<'PY'
          import json
          from datetime import date, timedelta

          with open("github-data.json") as f:
              data = json.load(f)

          calendar = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]

          total = calendar["totalContributions"]

          days = []

          for week in calendar["weeks"]:
              for d in week["contributionDays"]:
                  days.append({
                      "date": d["date"],
                      "count": d["contributionCount"]
                  })

          days.sort(key=lambda x: x["date"])

          active_dates = {
              d["date"] for d in days if d["count"] > 0
          }

          # Current streak
          current = 0
          check = date.today()

          while check.isoformat() in active_dates:
              current += 1
              check -= timedelta(days=1)

          # Longest streak
          longest = 0
          streak = 0
          previous = None

          for d in days:
              if d["count"] > 0:
                  current_date = date.fromisoformat(d["date"])

                  if previous and current_date == previous + timedelta(days=1):
                      streak += 1
                  else:
                      streak = 1

                  longest = max(longest, streak)
                  previous = current_date

          # Safe SVG
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="1000" height="400" viewBox="0 0 1000 400">

          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#0f172a"/>
              <stop offset="50%" stop-color="#172554"/>
              <stop offset="100%" stop-color="#312e81"/>
            </linearGradient>

            <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#22d3ee"/>
              <stop offset="50%" stop-color="#818cf8"/>
              <stop offset="100%" stop-color="#f472b6"/>
            </linearGradient>
          </defs>

          <!-- Background -->
          <rect width="1000" height="400"
                rx="25"
                fill="url(#bg)"/>

          <!-- Border -->
          <rect x="3" y="3"
                width="994" height="394"
                rx="25"
                fill="none"
                stroke="url(#border)"
                stroke-width="4"/>

          <!-- Title -->
          <text x="50" y="60"
                fill="#ffffff"
                font-family="Arial"
                font-size="30"
                font-weight="bold">
            Viswa R R
          </text>

          <text x="50" y="88"
                fill="#94a3b8"
                font-family="Arial"
                font-size="16">
            Java Developer • GitHub Activity
          </text>

          <!-- Line -->
          <line x1="50" y1="115"
                x2="950" y2="115"
                stroke="#334155"
                stroke-width="2"/>

          <!-- Card 1 -->
          <rect x="50" y="145"
                width="270" height="190"
                rx="20"
                fill="#111827"
                stroke="#334155"
                stroke-width="2"/>

          <circle cx="185" cy="195"
                  r="38"
                  fill="none"
                  stroke="#22d3ee"
                  stroke-width="5"/>

          <text x="185" y="207"
                text-anchor="middle"
                fill="#ffffff"
                font-family="Arial"
                font-size="32"
                font-weight="bold">
            {total}
          </text>

          <text x="185" y="260"
                text-anchor="middle"
                fill="#ffffff"
                font-family="Arial"
                font-size="17"
                font-weight="bold">
            TOTAL CONTRIBUTIONS
          </text>

          <text x="185" y="290"
                text-anchor="middle"
                fill="#22d3ee"
                font-family="Arial"
                font-size="14">
            GITHUB ACTIVITY
          </text>

          <!-- Card 2 -->
          <rect x="365" y="145"
                width="270" height="190"
                rx="20"
                fill="#111827"
                stroke="#334155"
                stroke-width="2"/>

          <circle cx="500" cy="195"
                  r="38"
                  fill="#f97316"
                  opacity="0.15"/>

          <text x="500" y="210"
                text-anchor="middle"
                fill="#fb923c"
                font-family="Arial"
                font-size="35"
                font-weight="bold">
            {current}
          </text>

          <text x="500" y="260"
                text-anchor="middle"
                fill="#ffffff"
                font-family="Arial"
                font-size="17"
                font-weight="bold">
            CURRENT STREAK
          </text>

          <text x="500" y="290"
                text-anchor="middle"
                fill="#fb923c"
                font-family="Arial"
                font-size="14">
            DAYS
          </text>

          <!-- Card 3 -->
          <rect x="680" y="145"
                width="270" height="190"
                rx="20"
                fill="#111827"
                stroke="#334155"
                stroke-width="2"/>

          <circle cx="815" cy="195"
                  r="38"
                  fill="#a78bfa"
                  opacity="0.15"/>

          <text x="815" y="210"
                text-anchor="middle"
                fill="#a78bfa"
                font-family="Arial"
                font-size="35"
                font-weight="bold">
            {longest}
          </text>

          <text x="815" y="260"
                text-anchor="middle"
                fill="#ffffff"
                font-family="Arial"
                font-size="17"
                font-weight="bold">
            LONGEST STREAK
          </text>

          <text x="815" y="290"
                text-anchor="middle"
                fill="#a78bfa"
                font-family="Arial"
                font-size="14">
            DAYS
          </text>

          <!-- Footer -->
          <circle cx="55" cy="365"
                  r="5"
                  fill="#22c55e"/>

          <text x="70" y="371"
                fill="#94a3b8"
                font-family="Arial"
                font-size="13">
            LIVE GITHUB STATISTICS • UPDATED DAILY
          </text>

          </svg>'''

          with open("github-stats.svg", "w") as f:
              f.write(svg)

          print("Statistics generated successfully")
          print("Total:", total)
          print("Current streak:", current)
          print("Longest streak:", longest)
          PY

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-stats.svg

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update GitHub statistics"
            git push
          fi
